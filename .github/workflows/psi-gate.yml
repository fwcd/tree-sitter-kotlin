name: Kotlin PSI conformance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          java-package: jre
      - run: npm install
      - run: npm run psi-gate -- full
